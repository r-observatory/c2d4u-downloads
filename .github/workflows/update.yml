name: Update c2d4u Downloads
on:
  schedule:
    # Monthly on the 3rd at 05:45 UTC. The archive is frozen and its counts
    # move slowly, so a daily cron would be wasted work. Launchpad reports a
    # day within a day of it ending; the update counts through two days before
    # it runs.
    - cron: "45 5 3 * *"
  workflow_dispatch:
    inputs:
      reclassify_only:
        description: "Rebuild identity + summary from the already-downloaded shard history, with no Launchpad calls."
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  update:
    # One group with backfill.yml, so the update and a backfill never fetch
    # from Launchpad at the same time and the update never starts from a
    # release a backfill is still publishing. Job level, so the keepalive job
    # below is neither held nor cancelled with it. GitHub keeps one pending
    # run per group: a run queued behind a running one replaces any run that
    # was already pending.
    concurrency:
      group: c2d4u-downloads-launchpad
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::DBI
            any::RSQLite
            any::jsonlite
            any::curl
            any::testthat
            any::withr
            github::r-observatory/robservatory@v0.1.0
      - name: Run unit tests
        run: Rscript tests/testthat.R
      - name: Run update script
        # Below the job's 350 minutes, so a run that overruns fails here and a
        # timeout can never cancel the job partway through the publish step.
        # The script stops fetching at C2D4U_DEADLINE_MIN, which leaves room
        # under this limit for the rebuild and the export.
        timeout-minutes: 330
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          C2D4U_RECLASSIFY_ONLY: ${{ inputs.reclassify_only }}
          # A lone job in the Launchpad group, so it can use more connections
          # than one backfill shard.
          C2D4U_POOL: "8"
          C2D4U_DEADLINE_MIN: "280"
        run: |
          mkdir -p out
          Rscript scripts/update.R out/
      # Keep what is about to be published. The upload below goes one asset at
      # a time with the manifest last, and `gh release upload --clobber`
      # deletes an asset before uploading its replacement, so a failure partway
      # leaves a torn release or one missing an asset; this artifact lets it be
      # completed by uploading the same files again, without fetching anything
      # (see the README). Kept 90 days, longer than the monthly cadence, so it
      # outlives the month it may take to notice. A run with nothing to publish
      # writes out/skip-publish and has nothing to keep.
      - uses: actions/upload-artifact@v7
        if: hashFiles('out/skip-publish') == ''
        with:
          name: update-out-attempt-${{ github.run_attempt }}
          path: out/
          retention-days: 90
      - name: Publish changed shards to "current" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -f out/skip-publish ]; then
            echo "update wrote out/skip-publish: nothing new to publish, release left as it is"
            exit 0
          fi
          if ! gh release view current >/dev/null 2>&1; then
            git tag -f current
            git push -f origin current || true
            gh release create current \
              --title "c2d4u Downloads (rolling)" \
              --notes-file out/release_notes.md \
              --latest
          fi
          # Upload only the assets this run rebuilt (a heartbeat rebuilds none),
          # each checked on disk before anything is uploaded, then the
          # manifest last.
          [ -f out/upload-list.txt ] || { echo "::error::out/upload-list.txt is missing"; exit 1; }
          while IFS= read -r asset <&3; do
            [ -f "out/$asset" ] || { echo "::error::out/$asset is listed for upload but missing"; exit 1; }
          done 3< out/upload-list.txt
          while IFS= read -r asset <&3; do
            gh release upload current "out/$asset" --clobber
          done 3< out/upload-list.txt
          gh release upload current out/manifest.json --clobber
          gh release edit current --notes-file out/release_notes.md
  keepalive:
    # GitHub disables a public repository's scheduled workflows after 60 days
    # without repository activity. Publishing a release does not count, a commit
    # does. A separate job, so an update that fails or hits the 350-minute
    # timeout still keeps the monthly schedule alive.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # The work takes seconds; the rest is headroom for a slow runner start.
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Update last run timestamp
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for _ in 1 2 3; do
            # Decide against main as it is now, not the commit this run started
            # from, so a re-run, a queued run or a push that lands meanwhile
            # finds the newer commit and stops here instead of conflicting.
            git fetch --depth=1 origin main
            git reset --hard FETCH_HEAD
            # A commit a day is far inside the 60-day window, so skip when main
            # already has a commit from the last 20 hours.
            if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -lt 72000 ]; then
              echo "main already has a commit from the last 20 hours"
              exit 0
            fi
            echo "Last updated: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" > last-updated.txt
            git add last-updated.txt
            git commit -m "chore: update last run time"
            git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
